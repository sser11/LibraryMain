<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>БиблиоСфера — Выдача и возврат</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/circulation.css">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar">
    <div class="logo">Библио<span>Сфера</span></div>
    <div class="nav-section">
      <h4>УЧЕТ И ФОНДЫ</h4>
      <a href="index.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> <span>Главная панель</span></a>
      <a href="catalog.html" class="nav-item"><i class="fas fa-book"></i> <span>Каталог книг</span></a>
      <a href="readers.html" class="nav-item"><i class="fas fa-users"></i> <span>Читатели</span></a>
      <a href="circulation.html" class="nav-item"><i class="fas fa-exchange-alt"></i> <span>Выдача и возврат</span></a>
    </div>
    <div class="nav-section">
      <h4>АНАЛИТИКА</h4>
      <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i> <span>Отчеты и статистика</span></a>
      <a href="debtors.html" class="nav-item"><i class="fas fa-clock"></i> <span>Задолжники</span></a>
    </div>
    <div class="nav-section">
      <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> <span>Настройки</span></a>
    </div>
    <div class="user-info">
      <div class="avatar">АС</div>
      <span>Анна Смирнова<br><small>Библиотекарь</small></span>
    </div>
  </aside>

  <main class="main-content circulation-main">
    <h2 class="page-title"><i class="fas fa-exchange-alt"></i> Выдача и возврат</h2>
    
    <div class="circulation-two-columns">
      <div class="circulation-card">
        <h3><i class="fas fa-user"></i> Читатель</h3>
        <div class="search-input-group">
          <i class="fas fa-barcode"></i>
          <input type="text" id="readerSearchInput" placeholder="Штрих-код билета или ФИО...">
          <button id="searchReaderBtn" class="btn-primary-small">Найти</button>
        </div>
        <div id="readerInfo" class="reader-info-card" style="display: none;"></div>
      </div>
      <div class="circulation-card">
        <h3><i class="fas fa-book"></i> Книга</h3>
        <div class="search-input-group">
          <i class="fas fa-barcode"></i>
          <input type="text" id="bookSearchInput" placeholder="Инвентарный номер или штрих-код...">
          <button id="searchBookBtn" class="btn-primary-small">Найти</button>
        </div>
        <div id="bookInfo" class="book-info-card" style="display: none;"></div>
        <button id="addBookToIssueBtn" class="btn-outline add-book-btn" style="display: none;"><i class="fas fa-plus"></i> Добавить еще книгу</button>
      </div>
    </div>

    <div class="circulation-card" id="booksToIssueSection" style="display: none;">
      <h3><i class="fas fa-list"></i> Готово к выдаче (<span id="booksCount">0</span> книг)</h3>
      <div id="booksListContainer"></div>
      <div class="due-date-section">
        <label><i class="fas fa-calendar-alt"></i> Ожидаемый срок возврата:</label>
        <input type="date" id="dueDateInput">
      </div>
      <div class="action-buttons-row">
        <button id="clearAllBtn" class="btn-outline"><i class="fas fa-trash-alt"></i> Очистить</button>
        <button id="submitIssueBtn" class="btn-primary"><i class="fas fa-check"></i> Оформить выдачу</button>
      </div>
    </div>
    <footer>© БиблиоСфера — интеллектуальная система книговыдачи</footer>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/circulation.js"></script>
</body>
</html>
